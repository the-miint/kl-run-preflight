[build-system]
requires = ["setuptools>=64", "versioningit>=2"]
build-backend = "setuptools.build_meta"

[project]
name = "run-preflight"
dynamic = ["version"]
description = "Normalized SQLite run preflight, with round-trip support for legacy CSV sample sheets."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.versioningit]

[tool.versioningit.write]
file = "src/run_preflight/_version.py"

[tool.setuptools.package-data]
run_preflight = ["sql/*.sql", "sql/patches/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Stated explicitly rather than inherited: ruff's implicit default
# selection changes between releases, which silently changes what CI
# enforces.
select = ["E4", "E7", "E9", "F"]
